# Contrato de la Library API, en formato OpenAPI 3.0.
# Se sirve en http://localhost:3000/docs con Swagger UI. Guardá el archivo y recargá la página.
#
# Regla de toda la clase: el contrato de un endpoint se escribe ACÁ antes de programarlo.

openapi: 3.0.3

info:
  title: Library API
  version: 1.0.0
  description: |
    Books, authors and loans of a library.

    **Conventions**
    - All requests and responses are JSON.
    - Dates use the `YYYY-MM-DD` format.
    - All errors have the shape `{ "error": "..." }` (see the `Error` schema).

servers:
  - url: http://localhost:3000

# ──────────────────────────────────────────────────────────────
# Endpoints. Un bloque por ruta; dentro, un bloque por verbo.
# Empezá por /authors. Abajo hay una plantilla comentada para copiar.
# ──────────────────────────────────────────────────────────────
paths:
  /authors/{id}:
    get:
      summary: Obtiene los detalles de un autor por su ID
      tags:
        - Author
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Autor encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          description: El autor no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /authors:
    get:
      summary: Obtiene los detalles todos los autores
      tags:
        - Author
      responses:
        '200':
          description: Autor encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          description: El autor no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /books/{id}:
    get:
      summary: Obtiene los detalles de un libro por su ID
      tags:
        - Book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Libro encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: El Libro no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Borra un libro por su ID
      tags:
        - Book
      parameters:
        - name: id
          in: path
          required: true
          description: El id unico del libro
          schema:
            type: integer
      responses:
        '204':
          description: Libro borrado 
        '404':
          description: Libro no encontrado
    put:
      summary: Reemplazar libro
      tags:
        - Book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBook'
      responses:
        '200':
          description: Libro reemplazado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '201':
          description: Libro creado exitosamente en ese id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
    patch:
      summary: Actualizar Libro
      tags:
        - Book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBook'
      responses:
        '200':
          description: Libro actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'


  
  
  /books:
    get:
          summary: Lista los libros con filtros y paginación
          tags:
            - Book
          parameters:
            - name: available
              in: query
              required: false
              schema:
                type: boolean
            - name: page
              in: query
              required: false
              schema:
                type: integer
                minimum: 1
                default: 1
            - name: limit
              in: query
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 20
          responses:
            '200':
              description: Página de libros
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/BookPage'
    post:
      summary: Crea un nuevo libro
      tags:
        - Book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBook'
      responses:
        '201':
          description: Libro creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'


      

  
  
  
  
  /loans/{id}:
      get:
        summary: Obtiene los detalles de un libro prestado por su ID
        tags:
          - Loan
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: integer
        responses:
          '200':
            description:  prestamo encontrado exitosamente
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Loan'
          '404':
            description: El prestamo no existe
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
  
  /loans:
      get:
        summary: Obtiene los detalles de  los prestamos
        tags:
          - Loan
        responses:
          '200':
            description:  prestamo encontrado exitosamente
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Loan'
          '404':
            description: El prestamo no existe
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'










