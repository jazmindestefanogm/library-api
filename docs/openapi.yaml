# Contrato de la Library API, en formato OpenAPI 3.0.
# Se sirve en http://localhost:3000/docs con Swagger UI. Guardá el archivo y recargá la página.
#
# Regla de toda la clase: el contrato de un endpoint se escribe ACÁ antes de programarlo.

openapi: 3.0.3

info:
  title: Library API
  version: 1.0.0
  description: |
    Books, authors and loans of a library.

    **Conventions**
    - All requests and responses are JSON.
    - Dates use the `YYYY-MM-DD` format.
    - All errors have the shape `{ "error": "..." }` (see the `Error` schema).

servers:
  - url: http://localhost:3000

# ──────────────────────────────────────────────────────────────
# Endpoints. Un bloque por ruta; dentro, un bloque por verbo.
# Empezá por /authors. Abajo hay una plantilla comentada para copiar.
# ──────────────────────────────────────────────────────────────
paths: 
  /authors:
    get:
      summary: gets a list of authors
      responses:
        "200":
          description: Resource found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authors"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Resource not found
  /authors/{id}:
    get:
      summary: gets an author by its id
      responses:
        "200":
          description: Resource found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Resource not found
    delete:
      summary: deletes an author by its id
      responses:
        "204":
          description: author deleted
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Resource not found
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Resource not found
        "409":
          description: author has books
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Cannot delete author that has books
  /books:
    get:
      summary: gets a list of books
      responses:
        "200": 
          description: Resource found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookPage"

