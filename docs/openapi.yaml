# ──────────────────────────────────────────────────────────────
# Schemas: la forma de los datos. Tienen que coincidir con las
# tablas de la base y con las interfaces de src/types/.
# ──────────────────────────────────────────────────────────────
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Book not found
    
    Author:
      type: object
      required: [id,name,nationality]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Jorge Luis Borges
        nationality:
          type: string
          example: Argentinean

    Book:
      type: object
      required: [id,title,year,author_id,available]
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example:  Harry Potter y la piedra filosofal,
        year:
          type: integer
          example: 1997
        author_id:
          type: integer
          example: 1
        available :
          type: boolean
          example : false





    
    Loan:
      type: object
      required: [id,book_id,member_name,loan_date,return_date]
      properties:
        id:
          type: integer
          example: 1
        
        book_id:
          type: integer
          example : 1
        member_name:
          type: string
          example : Alan
        loan_date:
          type: string
          example: 2021-06-06
        return_date:
          type : string || null
          example : 2021-06-06 || null

    NewLoan:
        type: object
        required: [book_id,member_name]
        properties:
          book_id:
            type: integer
            example: 1
          
          member_name:
            type: "string"
            example : Alan
    
    LoanReturn:
        type: string
        example:  2021-06-06


    
    NewBook:
      type: object
      required: [title,year,author_id]
      properties:
        title:
          type : string
          minimum: 1
          maximum: 200
          example : El Principito
        
        year:
            type : integer
            minimum: 1000
            maximum: 2100
            example : 2026
        
        author_id:
          type : integer
          example : 1

    UpdateBook:
        type: object
        required: [title,year,author_id]
        properties:
          title:
            type : string
            minimum: 1
            maximum: 200
            example : El Principito
          
          year:
              type : integer
              minimum: 1000
              maximum: 2100
              example : 2026
          
          author_id:
            type : integer
            example : 1
    
    BookPage:
        type: object
        required: [data,total,page,limit]
        properties:
          total:
            type: integer
          page:
            type: integer
            minimum: 1
            example: 1
          limit:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
          data:
            type: array
            items:
              type: object
              required: [id,title,year,author_id,available]
              properties:
                id:
                  type: integer
                  example: 1
                title:
                  type: string
                  example: "Harry Potter y la piedra filosofal"
                year:
                  type: integer
                  example: 1997
                author_id:
                  type: integer
                  example: 1
                available:
                  type: boolean
                  example: false

